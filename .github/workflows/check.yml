name: Check MOT Lens
on:
  push:
    branches: [main, feat/mot-lens]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mot-lens-browser-evidence
          path: |
            .astack/report/evidence/
            playwright-report/
            test-results/
